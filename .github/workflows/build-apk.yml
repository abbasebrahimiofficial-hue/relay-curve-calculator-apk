name: Build Relay Curve Calculator APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate Android project files
        run: |
          mkdir -p app/src/main/java/com/example/relaycurve
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          cat << 'EOF_SETTINGS' > settings.gradle.kts
          pluginManagement { repositories { google(); maven("https://maven-central.storage-download.googleapis.com/maven2/"); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); maven("https://maven-central.storage-download.googleapis.com/maven2/"); mavenCentral() }
          }
          rootProject.name = "RelayCurveCalculator"
          include(":app")
          EOF_SETTINGS

          cat << 'EOF_BUILD' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_BUILD

          cat << 'EOF_PROPS' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_PROPS

          cat << 'EOF_APPBUILD' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.relaycurve"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.relaycurve"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.ui:ui-graphics")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF_APPBUILD

          cat << 'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Relay Curve Calculator"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat << 'EOF_ADAPTIVE' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF_ADAPTIVE
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat << 'EOF_BG' > app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#020A24</color>
          </resources>
          EOF_BG

          cat << 'EOF_MAIN' > app/src/main/java/com/example/relaycurve/MainActivity.kt
          package com.example.relaycurve

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlin.math.*

          private enum class Standard(val title: String) {
              IEC("IEC"), ANSI("IEEE / ANSI"), MANUFACTURER("Manufacturer Specific Curves")
          }
          private enum class Curve(val code: String, val title: String) {
              IEC_NI("NI", "Normal Inverse"), IEC_VI("VI", "Very Inverse"),
              IEC_EI("EI", "Extremely Inverse"), IEC_LI("LI", "Long-Time Inverse"),
              ANSI_MI("MI", "Moderately Inverse"), ANSI_I("I", "Inverse"),
              ANSI_VI("VI", "Very Inverse"), ANSI_EI("EI", "Extremely Inverse"),
              ANSI_SI("SI", "Short-Time Inverse")
          }
          private data class CalcResult(val seconds: Double?, val formula: String?, val message: String)

          private fun curveList(s: Standard): List<Curve> = when (s) {
              Standard.IEC -> listOf(Curve.IEC_NI, Curve.IEC_VI, Curve.IEC_EI, Curve.IEC_LI)
              Standard.ANSI -> listOf(Curve.ANSI_MI, Curve.ANSI_I, Curve.ANSI_VI, Curve.ANSI_EI, Curve.ANSI_SI)
              Standard.MANUFACTURER -> emptyList()
          }

          private fun calculate(s: Standard, c: Curve, pickup: Double, injected: Double, dial: Double): CalcResult {
              if (pickup <= 0.0 || injected <= 0.0 || dial < 0.0)
                  return CalcResult(null, null, "Invalid input values.")
              val m = injected / pickup
              if (m <= 1.0) return CalcResult(null, null, "Injected current must be greater than Pickup.")
              val (factor, formula) = when (s) {
                  Standard.IEC -> when (c) {
                      Curve.IEC_NI -> (0.14 / (m.pow(0.02) - 1.0)) to "t = TMS × 0.14 / ((I/Is)^0.02 − 1)"
                      Curve.IEC_VI -> (13.5 / (m - 1.0)) to "t = TMS × 13.5 / ((I/Is) − 1)"
                      Curve.IEC_EI -> (80.0 / (m.pow(2.0) - 1.0)) to "t = TMS × 80 / ((I/Is)^2 − 1)"
                      Curve.IEC_LI -> (120.0 / (m - 1.0)) to "t = TMS × 120 / ((I/Is) − 1)"
                      else -> return CalcResult(null, null, "The selected curve does not belong to IEC.")
                  }
                  Standard.ANSI -> when (c) {
                      Curve.ANSI_MI -> (0.0515 / (m.pow(0.02) - 1.0) + 0.114) to "t = TD × (0.0515 / (M^0.02 − 1) + 0.114)"
                      Curve.ANSI_VI -> (19.61 / (m.pow(2.0) - 1.0) + 0.491) to "t = TD × (19.61 / (M^2 − 1) + 0.491)"
                      Curve.ANSI_EI -> (28.2 / (m.pow(2.0) - 1.0) + 0.1217) to "t = TD × (28.2 / (M^2 − 1) + 0.1217)"
                      else -> return CalcResult(null, null, "An exact IEEE or manufacturer equation must be provided from a technical reference. No estimated result will be shown.")
                  }
                  Standard.MANUFACTURER -> return CalcResult(null, null, "Select the manufacturer, relay model, and exact curve specification to calculate.")
              }
              val seconds = dial * factor
              return if (seconds.isFinite() && seconds >= 0.0)
                  CalcResult(seconds, formula, "")
              else CalcResult(null, null, "Calculation is not possible with these inputs.")
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { RelayCalculator() }
              }
          }

          private fun tr(key: String, fa: Boolean): String = if (!fa) key else when (key) {
              "Protection Curve Calculator" -> "محاسبه‌گر منحنی حفاظتی"
              "Standard" -> "استاندارد"
              "IEEE / ANSI" -> "IEEE / ANSI"
              "Manufacturer Specific Curves" -> "منحنی‌های اختصاصی سازنده"
              "Manufacturer" -> "سازنده"
              "For a manufacturer-specific curve, the relay model and curve data must be specified." -> "برای منحنی اختصاصی، مدل رله و اطلاعات منحنی باید مشخص شود."
              "Curve Type" -> "نوع منحنی"
              "Normal Inverse" -> "معکوس نرمال"
              "Very Inverse" -> "معکوس زیاد"
              "Extremely Inverse" -> "معکوس خیلی زیاد"
              "Long-Time Inverse" -> "معکوس زمان‌طولانی"
              "Moderately Inverse" -> "معکوس متوسط"
              "Inverse" -> "معکوس"
              "Short-Time Inverse" -> "معکوس زمان‌کوتاه"
              "Pickup (A)" -> "جریان پیکاپ (آمپر)"
              "Injected Current (A)" -> "جریان تزریقی (آمپر)"
              "Time Dial" -> "ضریب زمانی (Time Dial)"
              "TMS" -> "ضریب زمانی (TMS)"
              "Show Formula" -> "نمایش فرمول"
              "Show Curve" -> "نمایش منحنی"
              "Calculate Operating Time" -> "محاسبه زمان عملکرد"
              "Relay Operating Time" -> "زمان عملکرد رله"
              "Calculation Formula" -> "فرمول محاسبه"
              "Characteristic Curve" -> "منحنی مشخصه"
              "Offline Test Version" -> "نسخه آزمایشی آفلاین"
              "Settings" -> "تنظیمات"
              "Language" -> "زبان"
              "English" -> "انگلیسی"
              "فارسی" -> "فارسی"
              "Software Made By Farzin Nekouiee" -> "نرم‌افزار ساخته‌شده توسط Farzin Nekouiee"
              "Invalid input values." -> "مقادیر ورودی نامعتبر است."
              "Injected current must be greater than Pickup." -> "جریان تزریقی باید بیشتر از جریان پیکاپ باشد."
              "The selected curve does not belong to IEC." -> "منحنی انتخاب‌شده متعلق به استاندارد IEC نیست."
              "An exact IEEE or manufacturer equation must be provided from a technical reference. No estimated result will be shown." -> "برای این منحنی باید معادله دقیق از مرجع فنی ارائه شود؛ نتیجه تخمینی نمایش داده نمی‌شود."
              "Select the manufacturer, relay model, and exact curve specification to calculate." -> "برای محاسبه، سازنده، مدل رله و مشخصات دقیق منحنی را انتخاب کنید."
              "Calculation is not possible with these inputs." -> "با این مقادیر امکان محاسبه وجود ندارد."
              "A verified equation is required to plot this curve." -> "برای رسم این منحنی، معادله تأییدشده لازم است."
              "Note: Before using these results for relay testing or settings, verify the curve and coefficients against the relay manual. Some ANSI and manufacturer-specific curves require exact manufacturer data." -> "توجه: پیش از استفاده از نتایج برای تست یا تنظیم رله، منحنی و ضرایب را با دفترچه رله تطبیق دهید. برخی منحنی‌های ANSI و اختصاصی به اطلاعات دقیق سازنده نیاز دارند."
              else -> key
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun RelayCalculator() {
              var isPersian by remember { mutableStateOf(false) }
              var settingsOpen by remember { mutableStateOf(false) }
              var standard by remember { mutableStateOf(Standard.IEC) }
              var curve by remember { mutableStateOf(Curve.IEC_NI) }
              var pickup by remember { mutableStateOf("100") }
              var injection by remember { mutableStateOf("500") }
              var dial by remember { mutableStateOf("0.1") }
              var showFormula by remember { mutableStateOf(false) }
              var showGraph by remember { mutableStateOf(false) }
              var result by remember { mutableStateOf<CalcResult?>(null) }
              var standardExpanded by remember { mutableStateOf(false) }
              var curveExpanded by remember { mutableStateOf(false) }
              var manufacturer by remember { mutableStateOf("Siemens") }
              var manufacturerExpanded by remember { mutableStateOf(false) }

              val dark = darkColorScheme(primary = Color(0xFF55B7D8), background = Color(0xFF101820), surface = Color(0xFF1B2833))
              MaterialTheme(colorScheme = dark) {
                  CompositionLocalProvider(LocalLayoutDirection provides if (isPersian) LayoutDirection.Rtl else LayoutDirection.Ltr) {
                  Surface(Modifier.fillMaxSize(), color = Color(0xFF101820)) {
                      Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(18.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              Column(Modifier.weight(1f)) {
                                  Text(tr("Protection Curve Calculator", isPersian), fontSize = 22.sp, fontWeight = FontWeight.Bold)
                                  Text(tr("Protection Curve Calculator", isPersian), color = Color(0xFF8BA9B8), fontSize = 12.sp)
                              }
                              TextButton(onClick = { settingsOpen = true }) { Text("⚙") }
                          }
                          HorizontalDivider(color = Color(0xFF344653))
                          SimpleDropdown(tr("Standard", isPersian), tr(standard.title, isPersian), standardExpanded, { standardExpanded = it }) {
                              Standard.values().forEach { item -> DropdownMenuItem(text = { Text(tr(item.title, isPersian)) }, onClick = {
                                  standard = item; curve = curveList(item).firstOrNull() ?: Curve.IEC_NI; result = null; standardExpanded = false
                              }) }
                          }
                          if (standard == Standard.MANUFACTURER) {
                              SimpleDropdown(tr("Manufacturer", isPersian), manufacturer, manufacturerExpanded, { manufacturerExpanded = it }) {
                                  listOf("Siemens", "ABB", "Schneider Electric", "GE", "SEL").forEach { item ->
                                      DropdownMenuItem(text = { Text(item) }, onClick = { manufacturer = item; result = null; manufacturerExpanded = false })
                                  }
                              }
                              Text(tr("For a manufacturer-specific curve, the relay model and curve data must be specified.", isPersian), color = Color(0xFFFFC46B), fontSize = 12.sp)
                          } else {
                              SimpleDropdown(tr("Curve Type", isPersian), "${curve.code} — ${tr(curve.title, isPersian)}", curveExpanded, { curveExpanded = it }) {
                                  curveList(standard).forEach { item -> DropdownMenuItem(text = { Text("${item.code} — ${tr(item.title, isPersian)}") }, onClick = { curve = item; result = null; curveExpanded = false }) }
                              }
                          }
                          NumberInput(tr("Pickup (A)", isPersian), pickup) { pickup = it; result = null }
                          NumberInput(tr("Injected Current (A)", isPersian), injection) { injection = it; result = null }
                          NumberInput(if (standard == Standard.ANSI) tr("Time Dial", isPersian) else tr("TMS", isPersian), dial) { dial = it; result = null }
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(18.dp)) {
                              Row(Modifier.weight(1f), horizontalArrangement = Arrangement.Start) {
                                  Checkbox(showFormula, { showFormula = it }); Text(tr("Show Formula", isPersian), Modifier.padding(top = 12.dp))
                              }
                              Row(Modifier.weight(1f), horizontalArrangement = Arrangement.Start) {
                                  Checkbox(showGraph, { showGraph = it }); Text(tr("Show Curve", isPersian), Modifier.padding(top = 12.dp))
                              }
                          }
                          Button(onClick = { result = calculate(standard, curve, pickup.toDoubleOrNull() ?: 0.0, injection.toDoubleOrNull() ?: 0.0, dial.toDoubleOrNull() ?: -1.0) }, modifier = Modifier.fillMaxWidth()) {
                              Text(tr("Calculate Operating Time", isPersian))
                          }
                          result?.let { r ->
                              Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF1B2833))) {
                                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                      Text(tr("Relay Operating Time", isPersian), color = Color(0xFF8BA9B8))
                                      if (r.seconds != null) Text(String.format("%.4f s", r.seconds), color = Color(0xFF72D1A5), fontSize = 28.sp, fontWeight = FontWeight.Bold)
                                      else Text(tr(r.message, isPersian), color = Color(0xFFFFC46B))
                                      if (showFormula && r.formula != null) {
                                          HorizontalDivider(color = Color(0xFF344653))
                                          Text(tr("Calculation Formula", isPersian), fontWeight = FontWeight.Bold)
                                          Text(r.formula, color = Color(0xFFE7EEF2), fontSize = 13.sp)
                                      }
                                  }
                              }
                          }
                          if (showGraph) {
                              Text(tr("Characteristic Curve", isPersian), color = Color(0xFF55B7D8), fontWeight = FontWeight.Bold)
                              CurveGraph(standard, curve, dial.toDoubleOrNull() ?: 0.1, isPersian)
                          }
                          Text(tr("Note: Before using these results for relay testing or settings, verify the curve and coefficients against the relay manual. Some ANSI and manufacturer-specific curves require exact manufacturer data.", isPersian), color = Color(0xFFFFC46B), fontSize = 11.sp)
                          Text(tr("Offline Test Version", isPersian), color = Color(0xFF718792), fontSize = 10.sp)
                      }
                  }
                  if (settingsOpen) {
                      AlertDialog(
                          onDismissRequest = { settingsOpen = false },
                          title = { Text(tr("Settings", isPersian)) },
                          text = {
                              Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                  Text(tr("Language", isPersian), fontWeight = FontWeight.Bold)
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      OutlinedButton(onClick = { isPersian = false }) { Text("English") }
                                      OutlinedButton(onClick = { isPersian = true }) { Text("فارسی") }
                                  }
                                  Text("Software Made By Farzin Nekouiee", color = Color(0xFF8BA9B8), fontSize = 13.sp)
                              }
                          },
                          confirmButton = { TextButton(onClick = { settingsOpen = false }) { Text(if (isPersian) "بستن" else "Close") } }
                      )
                  }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun SimpleDropdown(label: String, value: String, expanded: Boolean, onExpanded: (Boolean) -> Unit, menu: @Composable ColumnScope.() -> Unit) {
              ExposedDropdownMenuBox(expanded = expanded, onExpandedChange = onExpanded) {
                  OutlinedTextField(value = value, onValueChange = {}, readOnly = true, label = { Text(label) }, modifier = Modifier.menuAnchor().fillMaxWidth())
                  ExposedDropdownMenu(expanded = expanded, onDismissRequest = { onExpanded(false) }, content = menu)
              }
          }

          @Composable
          private fun NumberInput(label: String, value: String, onChange: (String) -> Unit) {
              OutlinedTextField(value = value, onValueChange = onChange, label = { Text(label) }, modifier = Modifier.fillMaxWidth(), keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), singleLine = true)
          }

          @Composable
          private fun CurveGraph(standard: Standard, curve: Curve, dial: Double, isPersian: Boolean) {
              Canvas(Modifier.fillMaxWidth().height(210.dp).background(Color(0xFF16232D), RoundedCornerShape(10.dp)).padding(10.dp)) {
                  val l = 12f; val t = 8f; val r = size.width - 8f; val b = size.height - 12f
                  val w = r - l; val h = b - t
                  for (n in 0..4) {
                      val x = l + w * n / 4f; val y = t + h * n / 4f
                      drawLine(Color(0xFF344653), Offset(x, t), Offset(x, b), 1f)
                      drawLine(Color(0xFF344653), Offset(l, y), Offset(r, y), 1f)
                  }
                  val pts = mutableListOf<Offset>()
                  for (k in 0..120) {
                      val m = 1.05 + 48.0 * k / 120.0
                      val f = when (standard) {
                          Standard.IEC -> when (curve) {
                              Curve.IEC_NI -> 0.14 / (m.pow(0.02) - 1.0)
                              Curve.IEC_VI -> 13.5 / (m - 1.0)
                              Curve.IEC_EI -> 80.0 / (m.pow(2.0) - 1.0)
                              Curve.IEC_LI -> 120.0 / (m - 1.0)
                              else -> Double.NaN
                          }
                          Standard.ANSI -> when (curve) {
                              Curve.ANSI_MI -> 0.0515 / (m.pow(0.02) - 1.0) + 0.114
                              Curve.ANSI_VI -> 19.61 / (m.pow(2.0) - 1.0) + 0.491
                              Curve.ANSI_EI -> 28.2 / (m.pow(2.0) - 1.0) + 0.1217
                              else -> Double.NaN
                          }
                          Standard.MANUFACTURER -> Double.NaN
                      }
                      val sec = f * dial
                      if (sec.isFinite() && sec > 0) {
                          val xx = l + (ln(m / 1.05) / ln(49.05 / 1.05)).toFloat() * w
                          val yy = b - ((ln(sec.coerceIn(0.001, 10000.0) / 0.001) / ln(10000.0 / 0.001)).toFloat() * h)
                          pts.add(Offset(xx, yy))
                      }
                  }
                  pts.zipWithNext().forEach { (a, z) -> drawLine(Color(0xFF55B7D8), a, z, 3f) }
              }
              if (standard == Standard.MANUFACTURER || (standard == Standard.ANSI && curve !in listOf(Curve.ANSI_MI, Curve.ANSI_VI, Curve.ANSI_EI)))
                  Text(tr("A verified equation is required to plot this curve.", isPersian), color = Color(0xFFFFC46B), fontSize = 11.sp)
          }
          EOF_MAIN

      - name: Generate electrical protection app icons
        run: |
          python3 -m pip install -q pillow
          python3 - << 'EOF_ICON'
          import os, math
          from PIL import Image, ImageDraw, ImageFilter

          S = 1024
          bg = Image.new("RGBA", (S, S))
          px = bg.load()
          cx, cy = S * 0.5, S * 0.48
          for y in range(S):
              for x in range(S):
                  d = math.hypot(x - cx, y - cy) / (S * 0.65)
                  t = max(0.0, min(1.0, 1.0 - d))
                  px[x, y] = (int(2 + 12 * (t ** 1.6)), int(10 + 38 * (t ** 1.5)), int(34 + 78 * (t ** 1.4)), 255)
          img = bg

          grid = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          gd = ImageDraw.Draw(grid)
          for i in range(1, 8):
              pos = int(S * i / 8)
              gd.line([(pos, 80), (pos, S - 80)], fill=(40, 140, 200, 32), width=2)
              gd.line([(80, pos), (S - 80, pos)], fill=(40, 140, 200, 32), width=2)
          img = Image.alpha_composite(img, grid)

          def shield_pts(scale=1.0):
              raw = [(512,155),(675,228),(795,248),(786,480),(745,635),(650,765),(512,862),(374,765),(279,635),(238,480),(229,248),(349,228)]
              return [(512 + (x - 512) * scale, 512 + (y - 512) * scale) for x, y in raw]

          aura = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ImageDraw.Draw(aura).polygon(shield_pts(1.03), fill=(30, 160, 230, 55))
          img = Image.alpha_composite(img, aura.filter(ImageFilter.GaussianBlur(24)))

          sh = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          sd = ImageDraw.Draw(sh)
          sd.polygon(shield_pts(1.00), fill=(195, 212, 228, 255))
          sd.polygon(shield_pts(0.955), fill=(72, 92, 118, 255))
          sd.polygon(shield_pts(0.91), fill=(218, 232, 245, 255))
          sd.polygon(shield_pts(0.865), fill=(14, 34, 68, 255))
          sd.polygon(shield_pts(0.835), fill=(8, 22, 52, 255))
          img = Image.alpha_composite(img, sh)

          bolt = [(595,205),(415,510),(508,510),(418,818),(628,468),(528,468)]
          bglow = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ImageDraw.Draw(bglow).polygon(bolt, fill=(255, 175, 20, 210))
          img = Image.alpha_composite(img, bglow.filter(ImageFilter.GaussianBlur(26)))

          bl = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          bd = ImageDraw.Draw(bl)
          bd.polygon(bolt, fill=(255, 195, 35, 255))
          bd.polygon([(578,245),(442,495),(522,495),(452,745),(595,482),(512,482)], fill=(255, 238, 130, 255))
          img = Image.alpha_composite(img, bl)

          pts = []
          for k in range(100):
              u = k / 99.0
              x = 305 + u * 505
              m = 1.28 + u * 5.8
              y = 708 - min(1.0, (1.0 / (m ** 1.25 - 0.72)) / 1.65) * 440
              pts.append((x, y))

          cglow = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ImageDraw.Draw(cglow).line(pts, fill=(0, 235, 255, 220), width=32, joint="curve")
          img = Image.alpha_composite(img, cglow.filter(ImageFilter.GaussianBlur(18)))

          cl = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          cd = ImageDraw.Draw(cl)
          cd.line(pts, fill=(35, 240, 255, 255), width=18, joint="curve")
          cd.line(pts, fill=(210, 252, 255, 255), width=7, joint="curve")
          tx, ty = pts[34]
          cd.ellipse((tx - 16, ty - 16, tx + 16, ty + 16), fill=(255, 255, 255, 255), outline=(0, 230, 255, 255), width=6)
          img = Image.alpha_composite(img, cl)

          for name, size in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              d = f"app/src/main/res/mipmap-{name}"
              os.makedirs(d, exist_ok=True)
              sq = img.resize((size, size), Image.Resampling.LANCZOS)
              sq.save(f"{d}/ic_launcher.png", "PNG")
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, size - 1, size - 1), fill=255)
              rnd = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              rnd.paste(sq, (0, 0), mask)
              rnd.save(f"{d}/ic_launcher_round.png", "PNG")

          os.makedirs("app/src/main/res/drawable-xxxhdpi", exist_ok=True)
          fg = Image.new("RGBA", (432, 432), (2, 10, 36, 255))
          inner = img.resize((294, 294), Image.Resampling.LANCZOS)
          fg.paste(inner, (69, 69), inner)
          fg.save("app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png", "PNG")
          EOF_ICON

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk RelayCurveCalculator-v0.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayCurveCalculator-APK
          path: RelayCurveCalculator-v0.1.0.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.0 RelayCurveCalculator-v0.1.0.apk \
            --title "Relay Curve Calculator v0.1.0" \
            --notes "Android APK for Relay Curve Calculator (Bilingual EN/FA) with custom electrical protection logo." \
            || gh release upload v0.1.0 RelayCurveCalculator-v0.1.0.apk --clobber
